
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KHPA Certificate Application</title>
  <link rel="stylesheet" href="../css/style-formal.css" />
</head>
<body>
  <header style="text-align: center; padding: 1rem;">
    <img src="../img/logo.png" alt="KHPA Logo" style="width: 120px;" />
    <h1>Motor Vehicle Operator & Identification Certificate</h1>
    <p style="font-style: italic;">Select type below and fill out your details.</p>
  </header>

  <main style="max-width: 600px; margin: auto;">
    <form action="#" method="POST">
      <label for="cert-type">Certificate Type:</label>
      <select id="cert-type" name="cert-type" required>
        <option value="motor">Motor Vehicle Operator</option>
        <option value="id">Identification Certificate</option>
      </select>

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required />

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" required />

      <label for="height">Height:</label>
      <input type="text" id="height" name="height" required />

      <label for="weight">Weight:</label>
      <input type="text" id="weight" name="weight" required />

      <label for="hair">Hair:</label>
      <input type="text" id="hair" name="hair" required />

      <label for="eyes">Eyes:</label>
      <input type="text" id="eyes" name="eyes" required />

      <label for="sex">Sex:</label>
      <select id="sex" name="sex" required>
        <option value="k">Kāne (M)</option>
        <option value="w">Wahine (F)</option>
      </select>

      <label for="island">Island of Registration:</label>
      <select id="island" name="island" required>
        <option value="hawaii">Hawai‘i</option>
        <option value="maui">Maui</option>
        <option value="molokai">Moloka‘i</option>
        <option value="oahu">O‘ahu</option>
      </select>

      <label for="signature">Signature:</label>
      <input type="text" id="signature" name="signature" required />

      <button type="submit" style="margin-top: 1rem;">Submit</button>
    </form>
  </main>

  <footer style="text-align: center; margin-top: 2rem;">
    <p>© 2025 Ko Hawaiʻi Pae ʻĀina</p>
  </footer>
</body>
</html>
