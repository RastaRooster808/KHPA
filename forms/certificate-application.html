
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KHPA Certificate Application</title>
  <link rel="stylesheet" href="../css/style-formal.css" />
</head>
<body>
  <header>
    <img src="../img/logo.png" alt="KHPA Logo" style="width: 120px;" />
    <h1>Certificate Application</h1>
  </header>

  <div class="help-banner">
    Need help? Reach out to your local island office or email <strong>registration@khpa.io</strong> for assistance.
  </div>

  <form action="mailto:registration@khpa.io" method="post" enctype="text/plain" style="max-width: 600px; margin: auto;">
    <label>Full Name:<br/><input type="text" name="Full Name" required></label><br/><br/>
    <label>Date of Birth:<br/><input type="date" name="DOB" required></label><br/><br/>
    <label>Height:<br/><input type="text" name="Height" required></label><br/><br/>
    <label>Weight:<br/><input type="text" name="Weight" required></label><br/><br/>
    <label>Hair Color:<br/><input type="text" name="Hair" required></label><br/><br/>
    <label>Eye Color:<br/><input type="text" name="Eyes" required></label><br/><br/>
    <label>Sex (K/W):<br/><input type="text" name="Sex" required></label><br/><br/>
    <label>Island:<br/>
      <select name="Island" required>
        <option value="Hawai‘i">Hawai‘i</option>
        <option value="Maui">Maui</option>
        <option value="Moloka‘i">Moloka‘i</option>
        <option value="O‘ahu">O‘ahu</option>
      </select>
    </label><br/><br/>
    <input type="submit" value="Submit" />
  </form>

  <footer>
    <p>© 2025 Ko Hawaiʻi Pae ʻĀina</p>
  </footer>
</body>
</html>
