
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Registration - KHPA</title>
  <link rel="stylesheet" href="../css/style-formal.css" />
</head>
<body>
  <header>
    <img src="../img/logo.png" alt="KHPA Logo" style="width: 100px;" />
    <h1>Business Registration Form</h1>
    <p>Fill in the information below to register your business.</p>
  </header>
  <form style="max-width: 600px; margin: auto;">
    <label>Business Name:<br><input type="text" name="bizname" required /></label><br><br>
    <label>Business Owner:<br><input type="text" name="owner" required /></label><br><br>
    <label>Business Address:<br><input type="text" name="bizaddress" required /></label><br><br>
    <label>Type of Business:<br><input type="text" name="btype" required /></label><br><br>
    <label>Contact Email:<br><input type="email" name="email" required /></label><br><br>
    <button type="submit" class="cta-button">Submit</button>
  </form>
  <footer><p>© 2025 Ko Hawaiʻi Pae ʻĀina</p></footer>
</body>
</html>
