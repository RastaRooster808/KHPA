<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Registration</title>
  <link rel="stylesheet" href="../css/style-formal.css" />
</head>
<body>
  <header>
    <img src="../img/logo.png" alt="KHPA Logo" class="logo" />
    <h1>Business Registration</h1>
  </header>
  <form>
    <label>Owner's Full Name: <input type="text" name="owner_name" /></label>
    <label>Business Make & Model: <input type="text" name="business_name" /></label>
    <label>Year: <input type="text" name="year" /></label>
    <label>License Type: <input type="text" name="license" /></label>
    <label>Island: 
      <select name="island">
        <option value="hawaii">Hawai‘i</option>
        <option value="maui">Maui</option>
        <option value="molokai">Moloka‘i</option>
        <option value="oahu">O‘ahu</option>
      </select>
    </label>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
