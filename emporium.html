<!-- Language Toggle -->
<div class="langbar" <!-- KHPA Header (with Home button + language toggle) -->
<header class="khpa-header" role="banner">
  <div class="khpa-header__inner">
    <a class="khpa-home" href="index.html" aria-label="Home">
      <span class="khpa-home__crest" aria-hidden="true">KHPA</span>
      <span class="khpa-home__text">
        <span class="khpa-home__title">Ko Hawaiʻi Pae ʻĀina</span>
        <span class="khpa-home__sub">Kingdom Services Portal</span>
      </span>
    </a>

    <nav class="khpa-nav" aria-label="Primary">
      <a class="khpa-nav__link" href="index.html" data-i18n="nav.home">Home</a>
      <a class="khpa-nav__link" href="government-documents.html" data-i18n="nav.docs">Government Documents</a>
      <a class="khpa-nav__link" href="registration.html" data-i18n="nav.reg">Registration &amp; Licensing</a>
      <a class="khpa-nav__link is-active" href="emporium.html" data-i18n="nav.emp">Emporium</a>
      <a class="khpa-nav__link" href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>

    <div class="khpa-lang" role="navigation" aria-label="Language Toggle">
      <button class="khpa-lang__btn is-active" type="button" data-lang="en" aria-pressed="true">
        English
      </button>
      <button class="khpa-lang__btn" type="button" data-lang="haw" aria-pressed="false">
        ʻŌlelo Hawaiʻi
      </button>
    </div>
  </div>
</header>

<style>
  /* ===== KHPA Header ===== */
  .khpa-header{
    position: sticky; top: 0; z-index: 50;
    background: #fff;
    border-bottom: 1px solid rgba(0,0,0,.12);
  }
  .khpa-header__inner{
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* Home button */
  .khpa-home{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    border: 1px solid rgba(0,0,0,.14);
    border-radius: 14px;
    padding: 10px 12px;
    background: #fff;
  }
  .khpa-home__crest{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.18);
    font-weight: 800;
    letter-spacing: .6px;
  }
  .khpa-home__text{ display: grid; line-height: 1.1; }
  .khpa-home__title{ font-weight: 800; }
  .khpa-home__sub{ font-size: .86rem; opacity: .8; margin-top: 3px; }

  /* Nav */
  .khpa-nav{
    display: flex;
    gap: 10px;
    flex: 1 1 auto;
    min-width: 240px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .khpa-nav__link{
    text-decoration: none;
    color: inherit;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    opacity: .9;
    white-space: nowrap;
  }
  .khpa-nav__link:hover{
    border-color: rgba(0,0,0,.14);
    background: rgba(0,0,0,.03);
    opacity: 1;
  }
  .khpa-nav__link.is-active{
    border-color: rgba(0,0,0,.28);
    font-weight: 800;
    opacity: 1;
  }

  /* Language toggle */
  .khpa-lang{ display: inline-flex; gap: 8px; margin-left: auto; }
  .khpa-lang__btn{
    border: 1px solid rgba(0,0,0,.18);
    border-radius: 12px;
    padding: 10px 12px;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .khpa-lang__btn.is-active{
    border-color: rgba(0,0,0,.42);
    font-weight: 800;
  }

  /* Small screens */
  @media (max-width: 760px){
    .khpa-header__inner{ justify-content: center; }
    .khpa-lang{ width: 100%; justify-content: center; margin-left: 0; }
  }
</style>

<script>
  (function () {
    // Simple i18n for header labels + page sections (if you use data-lang-section)
    const dict = {
      en: {
        "nav.home": "Home",
        "nav.docs": "Government Documents",
        "nav.reg": "Registration & Licensing",
        "nav.emp": "Emporium",
        "nav.contact": "Contact"
      },
      haw: {
        "nav.home": "Home",
        "nav.docs": "Nā Palapala Aupuni",
        "nav.reg": "Kākau & Laikini",
        "nav.emp": "Hale Kūʻai",
        "nav.contact": "Hoʻokaʻaʻike"
      }
    };

    const buttons = document.querySelectorAll(".khpa-lang__btn");
    const i18nNodes = document.querySelectorAll("[data-i18n]");
    const sections = document.querySelectorAll("[data-lang-section]"); // optional, for bilingual page bodies

    function setLang(lang) {
      // translate header (and any element using data-i18n)
      i18nNodes.forEach(node => {
        const key = node.getAttribute("data-i18n");
        const val = (dict[lang] && dict[lang][key]) || (dict.en[key] || "");
        if (val) node.textContent = val;
      });

      // toggle bilingual body sections if present
      if (sections.length) {
        sections.forEach(sec => {
          const on = sec.getAttribute("data-lang-section") === lang;
          sec.hidden = !on;
        });
      }

      // button UI state
      buttons.forEach(btn => {
        const isOn = btn.getAttribute("data-lang") === lang;
        btn.classList.toggle("is-active", isOn);
        btn.setAttribute("aria-pressed", String(isOn));
      });

      // save
      try { localStorage.setItem("khpa_lang", lang); } catch(e) {}
      document.documentElement.setAttribute("lang", lang === "haw" ? "haw" : "en");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
    });

    // init
    let saved = "en";
    try { saved = localStorage.getItem("khpa_lang") || "en"; } catch(e) {}
    setLang(saved);
  })();
</script>
